name: Paid RAG benchmark
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RAGAS_DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints-py312.txt -e '.[evaluation]'
      - run: doculens ingest data/sample_docs
      - run: doculens-evaluate --output reports/benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-benchmark
          path: reports/benchmark/
